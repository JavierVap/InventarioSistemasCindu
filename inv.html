<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root { 
            --primary-color: #0ea5e9; 
            --primary-hover: #0284c7;
            --bg-app: #f8fafc;
            --sidebar-bg: #ffffff;
            --text-dark: #0f172a;
        }
        
        body { 
            background-color: var(--bg-app); 
            font-family: 'Inter', system-ui, sans-serif; 
            height: 100vh; 
            overflow-x: hidden; 
            color: var(--text-dark);
        }

        /* Pantalla de Login Mejorada */
        #login-view { 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            position: relative;
        }
        
        /* Círculos decorativos de fondo en el login para un toque moderno */
        #login-view::before {
            content: ''; position: absolute; top: -10%; left: -10%; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(14,165,233,0.15) 0%, rgba(0,0,0,0) 70%);
        }

        .login-card { 
            background: rgba(255, 255, 255, 0.98); 
            padding: 3rem 2.5rem; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 380px; 
            position: relative;
            z-index: 10;
        }

        .login-input {
            background-color: #f1f5f9;
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        .login-input:focus {
            background-color: #ffffff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        .btn-brand {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.75rem;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .btn-brand:hover { background-color: var(--primary-hover); color: white; }

        /* Dashboard */
        #dashboard-view { display: none; }
        
        .sidebar { 
            background-color: var(--sidebar-bg); 
            min-height: 100vh; 
            border-right: 1px solid #e2e8f0;
        }
        
        .nav-link.active {
            background-color: #f0f9ff !important;
            color: var(--primary-dark) !important;
            font-weight: 600;
        }

        .stat-card, .chart-container, .table-container { 
            background: #ffffff; 
            border-radius: 16px; 
            padding: 24px; 
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            margin-bottom: 24px; 
        }

        .status-badge { font-size: 0.75rem; padding: 6px 12px; border-radius: 20px; font-weight: 600; letter-spacing: 0.3px;}
        .table-responsive { max-height: 450px; overflow-y: auto; }
        .table th { color: #64748b; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #f1f5f9; }
        .table td { vertical-align: middle; }
        .btn-action { padding: 0.3rem 0.6rem; font-size: 0.875rem; border-radius: 10px; border-color: #e2e8f0; color: #475569;}
        .btn-action:hover { background-color: #f8fafc; border-color: var(--primary-color); color: var(--primary-color); }
    </style>
</head>
<body>

    <!-- ======================= PANTALLA DE LOGIN ======================= -->
    <div id="login-view">
        <div class="login-card">
            <div class="text-center mb-4">
                <div class="d-inline-block bg-primary bg-opacity-10 p-3 rounded-4 mb-3">
                    <i class="bi bi-box-seam text-primary" style="font-size: 2.5rem;"></i>
                </div>
                <h4 class="fw-bold text-dark mb-1">Insumos Control</h4>
                <p class="text-muted" style="font-size: 0.9rem;">Acceso al sistema corporativo</p>
            </div>
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label text-muted fw-medium" style="font-size: 0.85rem;">Cédula o Usuario</label>
                    <input type="text" class="form-control login-input" id="username" required placeholder="Ej. V-12345678">
                </div>
                <div class="mb-4">
                    <div class="d-flex justify-content-between">
                        <label class="form-label text-muted fw-medium" style="font-size: 0.85rem;">Clave</label>
                    </div>
                    <input type="password" class="form-control login-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-brand w-100">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <!-- ======================= DASHBOARD PRINCIPAL ======================= -->
    <div id="dashboard-view" class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-4 d-none d-md-block">
                <h5 class="fw-bold text-dark mb-4 d-flex align-items-center gap-2">
                    <i class="bi bi-box-seam text-primary"></i> InsumosApp
                </h5>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
                        <a class="nav-link active rounded-3" href="#"><i class="bi bi-grid-1x2 me-2"></i> Dashboard</a>
                    </li>
                </ul>
                <div class="mt-auto position-absolute bottom-0 mb-4 w-100" style="left: 0; padding: 0 1.5rem;">
                    <hr class="text-muted opacity-25">
                    <button id="btn-logout" class="btn btn-light w-100 text-start text-danger fw-medium rounded-3">
                        <i class="bi bi-box-arrow-left me-2"></i> Salir
                    </button>
                </div>
            </div>

            <!-- Contenido Principal -->
            <div class="col-md-10 p-4 pb-5">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="fw-bold mb-1">Panel de Control</h4>
                        <p class="text-muted mb-0" style="font-size: 0.9rem;">Área vinculada: <span id="user-dept" class="fw-semibold text-primary"></span></p>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-brand shadow-sm d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#modalNuevoInsumo">
                            <i class="bi bi-plus-lg"></i> <span class="d-none d-sm-inline">Nuevo Insumo</span>
                        </button>
                        <div class="d-flex align-items-center gap-2 border rounded-pill px-3 py-1 bg-white">
                            <span class="text-dark fw-medium" id="user-name" style="font-size: 0.9rem;">Usuario</span>
                            <i class="bi bi-person-circle text-muted fs-5"></i>
                        </div>
                    </div>
                </div>

                <!-- Formulario de Retiro y Tabla -->
                <div class="row">
                    <!-- Formulario de Retiro -->
                    <div class="col-xl-3 col-lg-4 mb-4">
                        <div class="chart-container h-100">
                            <h6 class="fw-bold mb-4">Registrar Retiro / Cambio</h6>
                            <form id="form-retiro">
                                <div class="mb-3">
                                    <label class="form-label text-muted" style="font-size: 0.85rem;">Buscar Insumo</label>
                                    <select class="form-select login-input" id="select-insumo-retiro" required></select>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted" style="font-size: 0.85rem;">Cantidad</label>
                                    <input type="number" class="form-control login-input" id="cantidad-retiro" min="1" value="1" required>
                                </div>
                                <button type="submit" class="btn w-100" style="background-color: #f1f5f9; color: var(--text-dark); font-weight: 600; border-radius: 12px;">
                                    <i class="bi bi-arrow-down-circle me-1"></i> Retirar Insumo
                                </button>
                            </form>
                            <div id="toast-retiro" class="alert alert-success mt-3 d-none p-2 text-center" style="font-size: 0.85rem; border-radius: 10px;"></div>
                        </div>
                    </div>

                    <!-- TABLA DE INVENTARIO -->
                    <div class="col-xl-9 col-lg-8 mb-4">
                        <div class="table-container h-100">
                            <h6 class="fw-bold mb-4">Inventario General</h6>
                            <div class="table-responsive pe-2">
                                <table class="table table-hover align-middle" style="font-size: 0.9rem;">
                                    <thead>
                                        <tr>
                                            <th>Insumo</th>
                                            <th>Modelo / Equipo</th>
                                            <th>Dpto.</th>
                                            <th class="text-center">Stock</th>
                                            <th class="text-center">Min.</th>
                                            <th>Últ. Cambio</th>
                                            <th>Estado</th>
                                            <th class="text-end">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-inventario">
                                        <!-- Se llena con JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ======================= MODAL: AGREGAR INSUMO ======================= -->
    <div class="modal fade" id="modalNuevoInsumo" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0" style="border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);">
                <div class="modal-header border-0 pb-0 pt-4 px-4">
                    <h5 class="modal-title fw-bold">Registrar Nuevo Insumo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="form-nuevo-insumo">
                        <div class="mb-3">
                            <label class="form-label text-muted" style="font-size: 0.85rem;">Nombre del artículo</label>
                            <input type="text" class="form-control login-input" id="nuevo-nombre" required placeholder="Ej. Tinta Negra T544">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-primary" style="font-size: 0.85rem;"><i class="bi bi-printer"></i> Modelo de Equipo (Opcional)</label>
                            <input type="text" class="form-control login-input" id="nuevo-modelo" placeholder="Ej. Epson EcoTank L3250">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted" style="font-size: 0.85rem;">Asignar a Departamento</label>
                            <select class="form-select login-input" id="nuevo-departamento" required>
                                <option value="">Seleccione el área...</option>
                                <option value="Compras">Compras</option>
                                <option value="Ventas">Ventas</option>
                                <option value="Contabilidad">Contabilidad</option>
                                <option value="Impuesto">Impuesto</option>
                                <option value="Servicio Médico">Servicio Médico</option>
                                <option value="Gerencia de Finanzas">Gerencia de Finanzas</option>
                                <option value="Gerencia de Operaciones">Gerencia de Operaciones</option>
                                <option value="Logística">Logística</option>
                                <option value="Laboratorio">Laboratorio</option>
                                <option value="Mercadeo">Mercadeo</option>
                                <option value="Materia Prima">Materia Prima</option>
                                <option value="Uso General">Uso General (Toda la empresa)</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted" style="font-size: 0.85rem;">Stock Inicial</label>
                                <input type="number" class="form-control login-input" id="nuevo-stock" min="0" value="5" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted" style="font-size: 0.85rem;">Alerta Mínima</label>
                                <input type="number" class="form-control login-input" id="nuevo-minimo" min="1" value="2" required>
                            </div>
                        </div>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-brand w-100 py-2">Guardar Insumo</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ======================= MODAL: EDITAR INSUMO ======================= -->
    <div class="modal fade" id="modalEditarInsumo" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0" style="border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);">
                <div class="modal-header border-0 pb-0 pt-4 px-4">
                    <h5 class="modal-title fw-bold">Editar Insumo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="form-editar-insumo">
                        <input type="hidden" id="editar-id"> 
                        <div class="mb-3">
                            <label class="form-label text-muted" style="font-size: 0.85rem;">Nombre del artículo</label>
                            <input type="text" class="form-control login-input" id="editar-nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-primary" style="font-size: 0.85rem;"><i class="bi bi-printer"></i> Modelo de Equipo</label>
                            <input type="text" class="form-control login-input" id="editar-modelo">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted" style="font-size: 0.85rem;">Departamento</label>
                            <select class="form-select login-input" id="editar-departamento" required>
                                <option value="Compras">Compras</option>
                                <option value="Ventas">Ventas</option>
                                <option value="Contabilidad">Contabilidad</option>
                                <option value="Impuesto">Impuesto</option>
                                <option value="Servicio Médico">Servicio Médico</option>
                                <option value="Gerencia de Finanzas">Gerencia de Finanzas</option>
                                <option value="Gerencia de Operaciones">Gerencia de Operaciones</option>
                                <option value="Logística">Logística</option>
                                <option value="Laboratorio">Laboratorio</option>
                                <option value="Mercadeo">Mercadeo</option>
                                <option value="Materia Prima">Materia Prima</option>
                                <option value="Uso General">Uso General</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted" style="font-size: 0.85rem;">Stock Actual</label>
                                <input type="number" class="form-control login-input" id="editar-stock" min="0" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted" style="font-size: 0.85rem;">Alerta Mínima</label>
                                <input type="number" class="form-control login-input" id="editar-minimo" min="1" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted" style="font-size: 0.85rem;">Último cambio</label>
                            <input type="date" class="form-control login-input" id="editar-fecha">
                        </div>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-dark w-100 py-2" style="border-radius: 12px; font-weight: 600;">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- BASE DE DATOS SIMULADA ---
        let inventario = [
            { id: 1, nombre: 'Tóner HP 85A', modelo_impresora: 'HP LaserJet P1102w', departamento: 'Contabilidad', stock: 1, minimo: 2, ultimo_cambio: '2026-09-15' },
            { id: 2, nombre: 'Tinta Epson T544', modelo_impresora: 'Epson L3210', departamento: 'Mercadeo', stock: 4, minimo: 2, ultimo_cambio: '2026-10-01' },
            { id: 3, nombre: 'Resmas de Papel A4', modelo_impresora: 'N/A', departamento: 'Uso General', stock: 20, minimo: 10, ultimo_cambio: '2026-10-05' }
        ];
        let nextId = 4;

        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const selectRetiro = document.getElementById('select-insumo-retiro');
        const tablaBody = document.getElementById('tabla-inventario');
        
        function getFechaHoy() {
            return new Date().toISOString().split('T')[0];
        }

        // --- RENDERIZAR INTERFAZ ---
        function actualizarInterfaz() {
            selectRetiro.innerHTML = '<option value="">Seleccione insumo...</option>';
            tablaBody.innerHTML = '';

            inventario.forEach(item => {
                let txtDropdown = item.modelo_impresora !== 'N/A' && item.modelo_impresora !== '' 
                    ? `[${item.departamento}] ${item.nombre} - ${item.modelo_impresora}` 
                    : `[${item.departamento}] ${item.nombre}`;

                let option = document.createElement('option');
                option.value = item.id;
                option.textContent = `${txtDropdown} (Disp: ${item.stock})`;
                selectRetiro.appendChild(option);

                let estadoBadge = item.stock <= item.minimo 
                    ? '<span class="badge bg-danger bg-opacity-10 text-danger border border-danger status-badge">Bajo Stock</span>' 
                    : '<span class="badge bg-success bg-opacity-10 text-success border border-success status-badge">Óptimo</span>';
                
                let txtModelo = item.modelo_impresora !== 'N/A' && item.modelo_impresora !== '' 
                    ? `<span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary" style="font-size:0.75rem;"><i class="bi bi-printer"></i> ${item.modelo_impresora}</span>`
                    : `<span class="text-muted" style="font-size:0.85rem;">N/A</span>`;

                let fila = `
                    <tr>
                        <td class="fw-semibold text-dark">${item.nombre}</td>
                        <td>${txtModelo}</td>
                        <td class="text-muted">${item.departamento}</td>
                        <td class="text-center fw-bold ${item.stock <= item.minimo ? 'text-danger' : 'text-dark'}">${item.stock}</td>
                        <td class="text-center text-muted">${item.minimo}</td>
                        <td class="fw-medium text-primary">${item.ultimo_cambio || 'N/A'}</td>
                        <td>${estadoBadge}</td>
                        <td class="text-end">
                            <button class="btn btn-action bg-white border" onclick="abrirModalEditar(${item.id})" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </button>
                        </td>
                    </tr>
                `;
                tablaBody.innerHTML += fila;
            });
        }

        // --- MODALES Y RETIROS ---
        function abrirModalEditar(id) {
            const insumo = inventario.find(i => i.id === id);
            document.getElementById('editar-id').value = insumo.id;
            document.getElementById('editar-nombre').value = insumo.nombre;
            document.getElementById('editar-modelo').value = insumo.modelo_impresora !== 'N/A' ? insumo.modelo_impresora : '';
            document.getElementById('editar-departamento').value = insumo.departamento;
            document.getElementById('editar-stock').value = insumo.stock;
            document.getElementById('editar-minimo').value = insumo.minimo;
            document.getElementById('editar-fecha').value = insumo.ultimo_cambio !== 'N/A' ? insumo.ultimo_cambio : '';
            new bootstrap.Modal(document.getElementById('modalEditarInsumo')).show();
        }

        document.getElementById('form-editar-insumo').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('editar-id').value);
            const insumo = inventario.find(i => i.id === id);

            insumo.nombre = document.getElementById('editar-nombre').value;
            insumo.modelo_impresora = document.getElementById('editar-modelo').value || 'N/A';
            insumo.departamento = document.getElementById('editar-departamento').value;
            insumo.stock = parseInt(document.getElementById('editar-stock').value);
            insumo.minimo = parseInt(document.getElementById('editar-minimo').value);
            insumo.ultimo_cambio = document.getElementById('editar-fecha').value || 'N/A';

            actualizarInterfaz();
            bootstrap.Modal.getInstance(document.getElementById('modalEditarInsumo')).hide();
        });

        document.getElementById('form-nuevo-insumo').addEventListener('submit', function(e) {
            e.preventDefault();
            inventario.push({
                id: nextId++,
                nombre: document.getElementById('nuevo-nombre').value,
                modelo_impresora: document.getElementById('nuevo-modelo').value || 'N/A',
                departamento: document.getElementById('nuevo-departamento').value,
                stock: parseInt(document.getElementById('nuevo-stock').value),
                minimo: parseInt(document.getElementById('nuevo-minimo').value),
                ultimo_cambio: 'N/A'
            });
            actualizarInterfaz();
            bootstrap.Modal.getInstance(document.getElementById('modalNuevoInsumo')).hide();
            this.reset();
        });

        document.getElementById('form-retiro').addEventListener('submit', function(e) {
            e.preventDefault();
            const idSeleccionado = parseInt(selectRetiro.value);
            const cantidad = parseInt(document.getElementById('cantidad-retiro').value);
            const toast = document.getElementById('toast-retiro');
            const insumo = inventario.find(i => i.id === idSeleccionado);

            if(insumo && insumo.stock >= cantidad) {
                insumo.stock -= cantidad; 
                insumo.ultimo_cambio = getFechaHoy(); 
                actualizarInterfaz(); 

                toast.textContent = `Retiro exitoso. Stock actualizado.`;
                toast.className = "alert alert-success mt-3 p-2 text-center";
                toast.classList.remove('d-none');
            } else {
                toast.textContent = "Error: Stock insuficiente.";
                toast.className = "alert alert-danger mt-3 p-2 text-center";
                toast.classList.remove('d-none');
            }
            setTimeout(() => { toast.classList.add('d-none'); }, 3000);
            this.reset();
        });

        // --- LOGIN SIMULADO ---
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            // Simulamos que el backend identificó a este usuario y sabe su departamento
            const departamentoAsignado = "Soporte TI"; 

            document.getElementById('user-name').textContent = username;
            document.getElementById('user-dept').textContent = departamentoAsignado;
            
            loginView.style.display = 'none';
            dashboardView.style.display = 'block';
            
            actualizarInterfaz();
        });

        document.getElementById('btn-logout').addEventListener('click', function() {
            dashboardView.style.display = 'none';
            loginView.style.display = 'flex';
            document.getElementById('login-form').reset();
        });
    </script>
</body>
</html>
